
services:
  postgres:
    image: postgres:16
    container_name: financeflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financeflow
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: financeflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - financeflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeflow -d financeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financeflow_postgres_data: